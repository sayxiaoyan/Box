plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 28

        python {
            def pythonPath = System.getenv("PYTHON_PATH")
            if (pythonPath != null && !pythonPath.isEmpty()) {
                buildPython(pythonPath)
            } else if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                buildPython("D:/Programs/Python/Python311/python.exe")
            } else {
                buildPython("python3")
            }
            pip {
                install "lxml"
                install "ujson"
                install "pyquery==2.0.1"
                install "cssselect==1.2.0"
                install "requests"
                install "PySocks"
                install "jsonpath"
                install "cachetools"
                install "pycryptodome"
                install "beautifulsoup4"
            }
        }
    }

    flavorDimensions "abi"

    productFlavors {
        armeabi {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }

        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // Android代码模块
            setRoot "src/main"
            // Python代码模块，也就是你的Python源码所在项目中的文件夹
            python.srcDirs = ["src/python"]
        }
    }

    buildToolsVersion '30.0.3'
}

dependencies {

}
